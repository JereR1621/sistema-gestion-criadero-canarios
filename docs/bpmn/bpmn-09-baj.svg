  <text x="482" y="632.0" font-family="Arial, Liberation Sans, sans-serif" font-size="21" text-anchor="start" fill="#356CA0" font-weight="bold">Sí</text>
  <rect x="478" y="725.0" width="31.519999999999982" height="29.0" fill="white"/>
  <text x="482" y="748.0" font-family="Arial, Liberation Sans, sans-serif" font-size="21" text-anchor="start" fill="#356CA0" font-weight="bold">No</text>
