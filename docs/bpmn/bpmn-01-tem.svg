  <text x="770" y="1438.0" font-family="Arial, Liberation Sans, sans-serif" font-size="24" text-anchor="middle" fill="#253957" font-weight="normal">Trasladar pichones y</text>
  <text x="770" y="1466.0" font-family="Arial, Liberation Sans, sans-serif" font-size="24" text-anchor="middle" fill="#253957" font-weight="normal">adultos a la jaula grande</text>
