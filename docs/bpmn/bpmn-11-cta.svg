  <text x="55" y="1809" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• Precondición: sesión de administrador; un criador no accede a esta función. El administrador ve los datos de registro y</text>
  <text x="55" y="1839" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">   el estado de las cuentas, nunca los datos de los criaderos (RF006, SEG-001).</text>
  <text x="55" y="1869" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• Desactivar una cuenta impide su ingreso y conserva sus datos (RF005). Toda acción administrativa se audita (SEG-003).</text>
