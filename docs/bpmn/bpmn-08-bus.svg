  <text x="55" y="1965" font-family="Arial, Liberation Sans, sans-serif" font-size="24" text-anchor="start" fill="#253957" font-weight="bold">Reglas y alcance del proceso</text>
  <text x="55" y="1999" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• Precondición: sesión de criador válida; todo se filtra por el criador de la sesión y un registro ajeno se trata como</text>
  <text x="55" y="2029" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">   inexistente (RF003).</text>
  <text x="55" y="2059" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• Por anillo se incluyen los dados de baja; por variedad, solo los activos. La ficha de una jaula muestra ocupantes, cruce</text>
  <text x="55" y="2089" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">   activo e historial por fecha (RF017, RF023, RF025, RF026).</text>
