  <text x="1272.5" y="652" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#356CA0" font-weight="bold">Sí</text>
  <text x="55" y="1467" font-family="Arial, Liberation Sans, sans-serif" font-size="24" text-anchor="start" fill="#253957" font-weight="bold">Reglas y alcance del proceso</text>
  <text x="55" y="1501" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• Precondición: sesión de criador válida. Solo se opera sobre un cruce del propio criadero (RF003).</text>
  <text x="55" y="1531" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• La fecha de fin no puede ser anterior a la fecha de inicio. El cierre conserva padres, pichones e historial</text>
  <text x="55" y="1561" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">  (RF022, DAT-004).</text>
  <text x="55" y="1591" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• Terminar el cruce no traslada automáticamente a sus integrantes ni finaliza otros cruces de la temporada. Los</text>
  <text x="55" y="1621" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">  traslados se registran en el proceso de jaulas y ubicaciones.</text>
