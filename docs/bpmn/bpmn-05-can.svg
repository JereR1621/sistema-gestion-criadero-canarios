  <text x="1142" y="1418" font-family="Arial, Liberation Sans, sans-serif" font-size="26" text-anchor="middle" fill="#253957" font-weight="normal">Auditar el cambio y mostrar</text>
  <text x="1142" y="1446" font-family="Arial, Liberation Sans, sans-serif" font-size="26" text-anchor="middle" fill="#253957" font-weight="normal">la ficha actualizada</text>
