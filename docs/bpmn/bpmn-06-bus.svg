  <text x="55" y="1627" font-family="Arial, Liberation Sans, sans-serif" font-size="24" text-anchor="start" fill="#253957" font-weight="bold">Reglas y alcance del proceso</text>
  <text x="55" y="1661" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• Precondición: sesión de criador válida. Todas las búsquedas y enlaces se filtran por el criadero de la sesión;</text>
  <text x="55" y="1691" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">  un ID ajeno se trata como no disponible sin revelar datos (RF003).</text>
  <text x="55" y="1721" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• Por anillo se incluyen canarios dados de baja; por variedad solo activos. Por jaula se muestran ocupantes</text>
  <text x="55" y="1751" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">  actuales y cruce activo (RF023, RF025, RF026).</text>
  <text x="55" y="1781" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• La ficha enlaza padres, hermanos, medios hermanos, crías y cruces. Cada cruce abre su ficha de cría con macho,</text>
  <text x="55" y="1811" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">  hembra y pichones (RF024, RF027).</text>
