  <text x="1142" y="1098" font-family="Arial, Liberation Sans, sans-serif" font-size="26" text-anchor="middle" fill="#253957" font-weight="normal">Conservar fichas e historial</text>
  <text x="1142" y="1126" font-family="Arial, Liberation Sans, sans-serif" font-size="26" text-anchor="middle" fill="#253957" font-weight="normal">y registrar auditoría</text>
