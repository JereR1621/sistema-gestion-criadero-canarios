# Sitio de TuCriadero dentro del contenedor (ver docker/Dockerfile).
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        # Toda URL que no sea un archivo de public/ la atiende public/index.php (el enrutador).
        FallbackResource /index.php
    </Directory>

    # Estilos: frontend/css/ se publica en la URL /css/ (contrato y frontend/README.md).
    Alias /css/ /var/www/html/frontend/css/
    <Directory /var/www/html/frontend/css>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
