name: Tarea
description: Trabajo del equipo que no es un requisito ni un defecto
labels: ["tipo:tarea"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Qué hay que hacer
    validations:
      required: true
  - type: input
    id: referencia
    attributes:
      label: Referencia en el SRS (si aplica)
      placeholder: DAT-005
  - type: textarea
    id: terminado
    attributes:
      label: Cuándo está terminada
