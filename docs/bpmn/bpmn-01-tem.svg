  <text x="1104" y="637.0" font-family="Arial, Liberation Sans, sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="normal">• Entre el cruce y el anillado ocurren la postura</text>
  <text x="1104" y="661.0" font-family="Arial, Liberation Sans, sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="normal">   y la incubación, que no se registran en el</text>
  <text x="1104" y="685.0" font-family="Arial, Liberation Sans, sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="normal">   sistema (fuera del alcance).</text>
  <text x="1104" y="709.0" font-family="Arial, Liberation Sans, sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="normal">• El criador anilla los pichones entre los 10 y</text>
  <text x="1104" y="733.0" font-family="Arial, Liberation Sans, sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="normal">   12 días de vida (glosario, RF021).</text>
  <rect x="1090" y="1079.0" width="520" height="190.0" fill="#FBFCFE" stroke="none"/>
  <path d="M1106,1079.0 L1090,1079.0 L1090,1269.0 L1106,1269.0" fill="none" stroke="#475569" stroke-width="2.5"/>
  <text x="1104" y="1107.0" font-family="Arial, Liberation Sans, sans-serif" font-size="18" text-anchor="start" fill="#253957" font-weight="bold">En cualquier momento, fuera de esta secuencia:</text>
  <text x="1104" y="1131.0" font-family="Arial, Liberation Sans, sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="normal">• Registrar canarios (Figura 9).</text>
  <text x="1104" y="1155.0" font-family="Arial, Liberation Sans, sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="normal">• Registrar jaulas (Figura 7).</text>
  <text x="1104" y="1179.0" font-family="Arial, Liberation Sans, sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="normal">• Buscar y consultar la genealogía (Figura 10).</text>
  <text x="1104" y="1203.0" font-family="Arial, Liberation Sans, sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="normal">• Dar de baja un canario (Figura 11).</text>
  <text x="1104" y="1227.0" font-family="Arial, Liberation Sans, sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="normal">• Ingreso (Figura 12); cuentas y catálogo, solo</text>
  <text x="1104" y="1251.0" font-family="Arial, Liberation Sans, sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="normal">   el administrador (Figuras 13 y 14).</text>
  <text x="796" y="308" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#253957" font-weight="normal">Inicio de la temporada de</text>
  <text x="796" y="334" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#253957" font-weight="normal">cría</text>
  <text x="724.0" y="639" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="end" fill="#253957" font-weight="normal">Pichones con 10 a 12</text>
  <text x="724.0" y="664" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="end" fill="#253957" font-weight="normal">días de vida</text>
  <text x="806.0" y="1209" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#253957" font-weight="normal">¿Planifica otro</text>
  <text x="806.0" y="1234" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#253957" font-weight="normal">cruce?</text>
  <text x="760" y="1682" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="middle" fill="#253957" font-weight="normal">Fin de la temporada</text>
  <rect x="684.48" y="1215" width="31.519999999999982" height="29" fill="white"/>
  <text x="712.0" y="1238" font-family="Arial, Liberation Sans, sans-serif" font-size="21" text-anchor="end" fill="#356CA0" font-weight="bold">Sí</text>
  <rect x="768" y="1295.0" width="31.519999999999982" height="29.0" fill="white"/>
  <text x="772" y="1318.0" font-family="Arial, Liberation Sans, sans-serif" font-size="21" text-anchor="start" fill="#356CA0" font-weight="bold">No</text>
  <text x="55" y="1860" font-family="Arial, Liberation Sans, sans-serif" font-size="24" text-anchor="start" fill="#253957" font-weight="bold">Reglas y alcance del proceso</text>
  <text x="55" y="1894" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• Vista general: cada caja de borde grueso es un proceso detallado en la figura indicada. Varios cruces pueden avanzar en</text>
  <text x="55" y="1924" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">   paralelo; cada uno sigue esta secuencia.</text>
  <text x="55" y="1954" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• La espera de 10 a 12 días la decide el criador: el sistema no programa avisos ni temporizadores automáticos.</text>
</svg>
