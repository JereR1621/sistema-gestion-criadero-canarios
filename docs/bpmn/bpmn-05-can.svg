  <rect x="133" y="686" width="144" height="29" fill="white"/>
  <text x="137" y="708" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#356CA0" font-weight="bold">Reintentar</text>
  <rect x="1268.5" y="630" width="40" height="29" fill="white"/>
  <text x="1272.5" y="652" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#356CA0" font-weight="bold">Sí</text>
  <text x="55" y="1787" font-family="Arial, Liberation Sans, sans-serif" font-size="24" text-anchor="start" fill="#253957" font-weight="bold">Reglas y alcance del proceso</text>
  <text x="55" y="1821" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• Precondición: sesión de criador válida. El canario y los padres, cuando existan, pertenecen al propio criadero</text>
  <text x="55" y="1851" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">  (RF003, DAT-004).</text>
  <text x="55" y="1881" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• El anillo identifica de por vida: socio, año, correlativo y club. El canario adquirido puede no tener padres y</text>
  <text x="55" y="1911" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">  registra procedencia. Sexo y variedad admiten sin determinar (RF007–RF010).</text>
  <text x="55" y="1941" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• La variedad con sexo debe coincidir con el del canario. No se permite portar un factor manifestado, dominante ni</text>
  <text x="55" y="1971" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">  ligado al sexo en una hembra (RF012–RF013, DAT-004).</text>
  <text x="55" y="2001" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• Al cambiar sexo, variedad o padres se recalculan solo portadores deducidos; los indicados por el criador se</text>
  <text x="55" y="2031" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">  conservan. El cambio de variedad se propaga a las crías afectadas según RF034.</text>
</svg>
