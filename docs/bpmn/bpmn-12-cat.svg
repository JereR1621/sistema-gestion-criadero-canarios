  <text x="470" y="922" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="middle" fill="#253957" font-weight="normal">Catálogo sin cambios</text>
  <text x="1060" y="1112" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="middle" fill="#253957" font-weight="normal">Catálogo actualizado</text>
  <rect x="984.48" y="645" width="31.519999999999982" height="29" fill="white"/>
  <text x="1012.0" y="668" font-family="Arial, Liberation Sans, sans-serif" font-size="21" text-anchor="end" fill="#356CA0" font-weight="bold">No</text>
  <rect x="478" y="609.0" width="31.519999999999982" height="29.0" fill="white"/>
  <text x="482" y="632.0" font-family="Arial, Liberation Sans, sans-serif" font-size="21" text-anchor="start" fill="#356CA0" font-weight="bold">Sí</text>
  <rect x="478" y="725.0" width="31.519999999999982" height="29.0" fill="white"/>
  <text x="482" y="748.0" font-family="Arial, Liberation Sans, sans-serif" font-size="21" text-anchor="start" fill="#356CA0" font-weight="bold">No</text>
  <rect x="1068" y="725.0" width="31.519999999999982" height="29.0" fill="white"/>
  <text x="1072" y="748.0" font-family="Arial, Liberation Sans, sans-serif" font-size="21" text-anchor="start" fill="#356CA0" font-weight="bold">Sí</text>
  <text x="862" y="1269" font-family="Arial, Liberation Sans, sans-serif" font-size="20" text-anchor="start" fill="#475569" font-weight="bold">Subproceso de evento: puede ocurrir en cualquier paso</text>
  <text x="950" y="1417" font-family="Arial, Liberation Sans, sans-serif" font-size="20" text-anchor="middle" fill="#253957" font-weight="normal">Sin conexión,</text>
  <text x="950" y="1441" font-family="Arial, Liberation Sans, sans-serif" font-size="20" text-anchor="middle" fill="#253957" font-weight="normal">mantenimiento o</text>
  <text x="950" y="1465" font-family="Arial, Liberation Sans, sans-serif" font-size="20" text-anchor="middle" fill="#253957" font-weight="normal">sesión expirada</text>
  <text x="1510" y="1417" font-family="Arial, Liberation Sans, sans-serif" font-size="20" text-anchor="middle" fill="#253957" font-weight="normal">Operación no</text>
  <text x="1510" y="1441" font-family="Arial, Liberation Sans, sans-serif" font-size="20" text-anchor="middle" fill="#253957" font-weight="normal">realizada; sin</text>
  <text x="1510" y="1465" font-family="Arial, Liberation Sans, sans-serif" font-size="20" text-anchor="middle" fill="#253957" font-weight="normal">cambios</text>
  <text x="55" y="1585" font-family="Arial, Liberation Sans, sans-serif" font-size="24" text-anchor="start" fill="#253957" font-weight="bold">Reglas y alcance del proceso</text>
  <text x="55" y="1619" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• Precondición: sesión de administrador; para los criadores el catálogo es de solo lectura (RF030, SEG-001). Las 880</text>
  <text x="55" y="1649" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">   variedades, sus factores y su composición vienen precargados (RF028, DAT-005).</text>
  <text x="55" y="1679" font-family="Arial, Liberation Sans, sans-serif" font-size="22" text-anchor="start" fill="#475569" font-weight="normal">• Los cambios aplican para todos los criadores y se auditan (RF032, SEG-003).</text>
